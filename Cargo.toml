[package]
name = "routes"
version = "0.1.0"
edition = "2024"

[dependencies]
flate2 = "1.1.10"
image-webp = "0.2.4"
png = "0.18.1"
rayon = "1.12.0"
rusqlite = { version = "0.41.1", features = ["bundled"] }
rustc-hash = "2.1.3"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
# native-certs: the system trust store (and SSL_CERT_FILE), not only the
# roots bundled in, so it works behind a TLS-terminating proxy.
ureq = { version = "2", features = ["native-certs"] }
zstd = "0.14.3"
