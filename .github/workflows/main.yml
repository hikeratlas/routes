name: build

on: 
  push:
    branches: [main]

  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v1

      - run: mkdir -p ../basemap
      - run: wget https://public.hikeratlas.com/tests/algonquin-ztrails.geojsonl -O ../basemap/ztrails.geojsonl
      - run: bun install
      - run: bun test
