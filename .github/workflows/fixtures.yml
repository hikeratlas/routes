name: Fixtures

# Curate a fixed set of parks (fixtures/parks.json: slow ones, and ones with
# routes we've fixed before) with this change and with the branch it targets,
# on the same tiles, and summarize how long each took and how the routes
# differ. Minutes, instead of a basemap build's hours.
#
# A push to main runs main alone and caches its results, keyed by its commit,
# for pull requests on it to compare against instead of rerunning main. It
# also saves the cargo, tile, QRank and DEM caches where every pull request
# can restore them: a cache saved by a pull request is only visible to that
# pull request.
#
# Jobs: build (the binaries, and the tiles and QRank into the cache), then
# the fixtures and the oracle sample's runs side by side, each on its own
# runner, then compare.
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

env:
  # Each fixture is stopped after this many seconds, so one slow park
  # can't hold up the comparison.
  LIMIT: 600

jobs:
  build:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 30
    outputs:
      snap: ${{ steps.snap.outputs.key }}
      prev: ${{ steps.prev.outputs.key }}
      # Whether the base's results came from the cache (else the run jobs
      # curate the base too)
      prev-hit: ${{ steps.prevcache.outputs.cache-hit == 'true' }}
    steps:
      - uses: actions/checkout@v4
        with:
          path: new

      - uses: actions/checkout@v4
        if: github.event_name == 'pull_request'
        with:
          ref: ${{ github.base_ref }}
          path: base

      # Saved only from main, where every pull request can restore it.
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: new
          save-if: ${{ github.ref == 'refs/heads/main' }}

      # The tiles come from a snapshot the last north-america build froze
      # (basemap's build-area.yml fixtures job; fixtures/latest.json), so
      # every pull request compares on the same tiles, and none is read while
      # a build rewrites them. A change to parks.json needs tiles the
      # snapshot doesn't have: those are extracted from the live layers.
      - name: Pick the fixture tiles
        id: snap
        run: |
          curl -sf https://public.hikeratlas.com/fixtures/latest.json > latest.json || echo '{}' > latest.json
          cat latest.json
          # The snapshot holds the fixtures and the oracle sample (oracle.json)
          parks=$(cat new/fixtures/parks.json new/fixtures/oracle.json | sha256sum | cut -d' ' -f1)
          if [ "$(jq -r '.parks_sha256 // ""' latest.json)" = "$parks" ]; then
            echo "key=snapshot-$(jq -r .id latest.json)" >> "$GITHUB_OUTPUT"
            echo "url=$(jq -r .url latest.json)" >> "$GITHUB_OUTPUT"
            echo "Fixture tiles: snapshot $(jq -r .id latest.json), built $(jq -r .built latest.json)" | tee -a "$GITHUB_STEP_SUMMARY"
          else
            echo "key=live-$parks-$(date -u +%G-%V)" >> "$GITHUB_OUTPUT"
            echo "Fixture tiles: extracted from the live layers (no snapshot for this parks.json)" | tee -a "$GITHUB_STEP_SUMMARY"
          fi

      # The base's results: from the run on its push to main if there was
      # one with these tiles and this run.sh, else curated here.
      - name: Base results key
        id: prev
        run: |
          if [ "${{ github.event_name }}" = pull_request ]; then
            sha=$(git -C base rev-parse HEAD)
          else
            sha=${{ github.sha }}
          fi
          # v2: with oracle-base-bonus, the base's oracle run as it ships
          echo "key=fixtures-base-v2-$sha-${{ steps.snap.outputs.key }}-${{ hashFiles('new/fixtures/run.sh') }}-$LIMIT" >> "$GITHUB_OUTPUT"

      # Only to see whether it's there: compare restores it.
      - name: Look for ${{ github.base_ref }}'s results
        id: prevcache
        if: github.event_name == 'pull_request'
        uses: actions/cache/restore@v4
        with:
          path: prev/
          key: ${{ steps.prev.outputs.key }}
          lookup-only: true

      - name: Build ${{ github.base_ref }}
        if: github.event_name == 'pull_request' && steps.prevcache.outputs.cache-hit != 'true'
        run: |
          # In new/target, so the dependencies built for it serve the new build too
          (cd base && cargo build --release --locked --target-dir ../new/target)
          mkdir -p bin && cp new/target/release/routes bin/routes-base

      # After building the base in the same target dir, cargo takes this
      # change's routes for the base's (it tells workspace packages apart by
      # their path in the workspace, the same for both) and, its sources
      # being older than that build, doesn't rebuild it: routes-new was the
      # base's binary whenever the base's results weren't cached (since #93).
      # Removing the routes package's build (not its dependencies') makes
      # cargo build it again.
      - name: Build this change
        run: |
          (cd new && cargo clean --release -p routes && cargo build --release --locked)
          mkdir -p bin && cp new/target/release/routes bin/routes-new

      - uses: actions/upload-artifact@v4
        with:
          name: bin
          path: bin/
          retention-days: 1

      # Into the cache (saved when this job ends), for the run jobs.
      - name: Restore fixture tiles
        id: tiles
        uses: actions/cache@v4
        with:
          path: tiles
          key: fixtures-tiles-${{ steps.snap.outputs.key }}

      - name: Fetch fixture tiles
        if: steps.tiles.outputs.cache-hit != 'true'
        env:
          URL: ${{ steps.snap.outputs.url }}
        run: |
          if [ -n "$URL" ]; then
            curl -sf --retry 4 "$URL" | tar xz
          else
            python3 -m venv "$RUNNER_TEMP/venv"
            "$RUNNER_TEMP/venv/bin/pip" install -q pmtiles requests
            "$RUNNER_TEMP/venv/bin/python" new/fixtures/extract.py https://public.hikeratlas.com/layers/north-america tiles
            "$RUNNER_TEMP/venv/bin/python" new/fixtures/extract.py --parks new/fixtures/oracle.json https://public.hikeratlas.com/layers/north-america tiles/oracle
          fi
          du -sh tiles

      - name: Restore QRank
        id: qrank
        uses: actions/cache@v4
        with:
          path: qrank.db
          key: fixtures-qrank-${{ steps.snap.outputs.key }}

      - name: Fetch QRank
        if: steps.qrank.outputs.cache-hit != 'true'
        run: wget -q --tries=4 -O qrank.db https://github.com/hikeratlas/qrank/releases/download/latest/qrank.db

  # One runner per set of runs. `base` is where the base's run of the same
  # parks goes, when its results weren't cached (pull requests only).
  run:
    needs: build
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - leg: fixtures
            title: Curate
            tiles: tiles
            limit: ''
            parks: ''
            args: ''
            base: base
          # Known-hike recall on the oracle sample: ~160 parks with OSM
          # hiking routes, in a tuning half and a held-out half (see
          # fixtures/oracle.py). Without the bump for following an OSM
          # hiking route (--no-known-bonus) it measures the route proposer
          # alone; with it, what ships, which the bump partly earns by
          # itself. Each is compared with the base's run of the same kind.
          - leg: oracle-new
            title: Oracle sample, no bump for known routes
            tiles: tiles/oracle
            limit: 120
            parks: new/fixtures/oracle.json
            args: --no-known-bonus
            base: oracle-base
          - leg: oracle-new-bonus
            title: Oracle sample, as it ships
            tiles: tiles/oracle
            limit: 120
            parks: new/fixtures/oracle.json
            args: ''
            base: oracle-base-bonus
    steps:
      - uses: actions/checkout@v4
        with:
          path: new

      - uses: actions/download-artifact@v4
        with:
          name: bin
          path: bin

      - name: Restore fixture tiles
        uses: actions/cache/restore@v4
        with:
          path: tiles
          key: fixtures-tiles-${{ needs.build.outputs.snap }}
          fail-on-cache-miss: true

      - name: Restore QRank
        uses: actions/cache/restore@v4
        with:
          path: qrank.db
          key: fixtures-qrank-${{ needs.build.outputs.snap }}
          fail-on-cache-miss: true

      # Per leg, as the legs read different tiles; saved from main.
      - name: Restore DEM tiles
        uses: actions/cache@v4
        with:
          path: dem
          key: fixtures-dem-${{ matrix.leg }}-${{ hashFiles('new/fixtures/parks.json', 'new/fixtures/oracle.json') }}-${{ github.sha }}
          restore-keys: fixtures-dem-${{ matrix.leg }}-${{ hashFiles('new/fixtures/parks.json', 'new/fixtures/oracle.json') }}-

      - name: ${{ matrix.title }} with ${{ github.base_ref }}
        if: matrix.base != '' && github.event_name == 'pull_request' && needs.build.outputs.prev-hit != 'true'
        env:
          ROUTES_ARGS: ${{ matrix.args }}
          L: ${{ matrix.limit }}
        run: |
          chmod +x bin/*
          new/fixtures/run.sh bin/routes-base ${{ matrix.tiles }} out/prev/${{ matrix.base }} qrank.db dem "${L:-$LIMIT}" ${{ matrix.parks }}

      - name: ${{ matrix.title }} with this change
        env:
          ROUTES_ARGS: ${{ matrix.args }}
          L: ${{ matrix.limit }}
        run: |
          chmod +x bin/*
          new/fixtures/run.sh bin/routes-new ${{ matrix.tiles }} out/new/${{ matrix.leg == 'fixtures' && 'new' || matrix.leg }} qrank.db dem "${L:-$LIMIT}" ${{ matrix.parks }}

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: out-${{ matrix.leg }}
          path: out/
          retention-days: 1

  compare:
    needs: [build, run]
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          path: new

      - name: Restore ${{ github.base_ref }}'s results
        if: github.event_name == 'pull_request' && needs.build.outputs.prev-hit == 'true'
        uses: actions/cache/restore@v4
        with:
          path: prev/
          key: ${{ needs.build.outputs.prev }}
          fail-on-cache-miss: true

      - uses: actions/download-artifact@v4
        with:
          pattern: out-*
          merge-multiple: true
          path: out

      # The base's runs, if curated in this run, and this change's
      - name: Gather
        run: |
          mkdir -p prev
          if [ -d out/prev ]; then cp -r out/prev/. prev/; fi
          ls prev out/new

      - name: Compare
        if: github.event_name == 'pull_request'
        run: |
          if [ "${{ needs.build.outputs.prev-hit }}" = true ]; then
            echo "${{ github.base_ref }}'s results (and times) are from its own run, on another runner of the same kind." | tee -a "$GITHUB_STEP_SUMMARY"
          fi
          python3 new/fixtures/compare.py prev/base out/new/new | tee -a "$GITHUB_STEP_SUMMARY"

      # Well-known routes that are very noticeable when missing or misnamed
      # (fixtures/expect/), on main and with this change. Information:
      # it never fails the job (some aren't fixed yet).
      - name: Named regressions
        if: github.event_name == 'pull_request'
        run: |
          echo "#### With ${{ github.base_ref }}" >> "$GITHUB_STEP_SUMMARY"
          python3 new/fixtures/expect.py prev/base | tee -a "$GITHUB_STEP_SUMMARY"
          echo "#### With this change" >> "$GITHUB_STEP_SUMMARY"
          python3 new/fixtures/expect.py out/new/new | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Compare on the oracle sample
        if: github.event_name == 'pull_request'
        run: |
          python3 new/fixtures/oracle.py --title "Known hikes on the oracle sample: the route proposer (no bump for known routes)" \
            prev/oracle-base out/new/oracle-new new/fixtures/oracle.json | tee -a "$GITHUB_STEP_SUMMARY"
          python3 new/fixtures/oracle.py --title "Known hikes on the oracle sample: as it ships (with the bump)" \
            prev/oracle-base-bonus out/new/oracle-new-bonus new/fixtures/oracle.json | tee -a "$GITHUB_STEP_SUMMARY"

      # On main, this run is the base for pull requests on this commit.
      - name: Keep main's results as a base
        if: github.event_name != 'pull_request'
        run: |
          cp -r out/new/new prev/base
          cp -r out/new/oracle-new prev/oracle-base
          cp -r out/new/oracle-new-bonus prev/oracle-base-bonus

      # From a pull request, for its next push on the same base.
      - name: Save the base's results
        if: github.event_name != 'pull_request' || needs.build.outputs.prev-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: prev/
          key: ${{ needs.build.outputs.prev }}

      - name: Upload the routes and logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fixtures
          path: |
            out/new/
            prev/
            !out/**/parks/
            !prev/**/parks/
