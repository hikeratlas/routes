name: Fixtures

# Curate a fixed set of parks (fixtures/parks.json: slow ones, and ones with
# routes we've fixed before) with this change and with the branch it targets,
# on the same tiles, and summarize how long each took and how the routes
# differ. Minutes, instead of a basemap build's hours.
#
# A push to main runs main alone and caches its results, keyed by its commit,
# for pull requests on it to compare against instead of rerunning main. It
# also saves the cargo, tile, QRank and DEM caches where every pull request
# can restore them: a cache saved by a pull request is only visible to that
# pull request.
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  fixtures:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 60
    env:
      # Each fixture is stopped after this many seconds, so one slow park
      # can't hold up the comparison.
      LIMIT: 600
    steps:
      - uses: actions/checkout@v4
        with:
          path: new

      - uses: actions/checkout@v4
        if: github.event_name == 'pull_request'
        with:
          ref: ${{ github.base_ref }}
          path: base

      # Saved only from main, where every pull request can restore it.
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: new
          save-if: ${{ github.ref == 'refs/heads/main' }}

      # The tiles come from a snapshot the last north-america build froze
      # (basemap's build-area.yml fixtures job; fixtures/latest.json), so
      # every pull request compares on the same tiles, and none is read while
      # a build rewrites them. A change to parks.json needs tiles the
      # snapshot doesn't have: those are extracted from the live layers.
      - name: Pick the fixture tiles
        id: snap
        run: |
          curl -sf https://public.hikeratlas.com/fixtures/latest.json > latest.json || echo '{}' > latest.json
          cat latest.json
          # The snapshot holds the fixtures and the oracle sample (oracle.json)
          parks=$(cat new/fixtures/parks.json new/fixtures/oracle.json | sha256sum | cut -d' ' -f1)
          if [ "$(jq -r '.parks_sha256 // ""' latest.json)" = "$parks" ]; then
            echo "key=snapshot-$(jq -r .id latest.json)" >> "$GITHUB_OUTPUT"
            echo "url=$(jq -r .url latest.json)" >> "$GITHUB_OUTPUT"
            echo "Fixture tiles: snapshot $(jq -r .id latest.json), built $(jq -r .built latest.json)" | tee -a "$GITHUB_STEP_SUMMARY"
          else
            echo "key=live-$parks-$(date -u +%G-%V)" >> "$GITHUB_OUTPUT"
            echo "Fixture tiles: extracted from the live layers (no snapshot for this parks.json)" | tee -a "$GITHUB_STEP_SUMMARY"
          fi

      # The base's results: from the run on its push to main if there was
      # one with these tiles and this run.sh, else curated here.
      - name: Base results key
        id: prev
        run: |
          if [ "${{ github.event_name }}" = pull_request ]; then
            sha=$(git -C base rev-parse HEAD)
          else
            sha=${{ github.sha }}
          fi
          echo "key=fixtures-base-$sha-${{ steps.snap.outputs.key }}-${{ hashFiles('new/fixtures/run.sh') }}-$LIMIT" >> "$GITHUB_OUTPUT"

      - name: Restore ${{ github.base_ref }}'s results
        id: prevcache
        if: github.event_name == 'pull_request'
        uses: actions/cache/restore@v4
        with:
          path: |
            prev/
            !prev/**/parks/
          key: ${{ steps.prev.outputs.key }}

      - name: Build ${{ github.base_ref }}
        if: github.event_name == 'pull_request' && steps.prevcache.outputs.cache-hit != 'true'
        run: |
          # In new/target, so the dependencies built for it serve the new build too
          (cd base && cargo build --release --locked --target-dir ../new/target)
          mkdir -p base-bin && cp new/target/release/routes base-bin/

      - name: Build this change
        run: cd new && cargo build --release --locked

      - name: Restore fixture tiles
        id: tiles
        uses: actions/cache@v4
        with:
          path: tiles
          key: fixtures-tiles-${{ steps.snap.outputs.key }}

      - name: Fetch fixture tiles
        if: steps.tiles.outputs.cache-hit != 'true'
        env:
          URL: ${{ steps.snap.outputs.url }}
        run: |
          if [ -n "$URL" ]; then
            curl -sf --retry 4 "$URL" | tar xz
          else
            python3 -m venv "$RUNNER_TEMP/venv"
            "$RUNNER_TEMP/venv/bin/pip" install -q pmtiles requests
            "$RUNNER_TEMP/venv/bin/python" new/fixtures/extract.py https://public.hikeratlas.com/layers/north-america tiles
            "$RUNNER_TEMP/venv/bin/python" new/fixtures/extract.py --parks new/fixtures/oracle.json https://public.hikeratlas.com/layers/north-america tiles/oracle
          fi
          du -sh tiles

      - name: Restore QRank
        id: qrank
        uses: actions/cache@v4
        with:
          path: qrank.db
          key: fixtures-qrank-${{ steps.snap.outputs.key }}

      - name: Fetch QRank
        if: steps.qrank.outputs.cache-hit != 'true'
        run: wget -q --tries=4 -O qrank.db https://github.com/hikeratlas/qrank/releases/download/latest/qrank.db

      - name: Restore DEM tiles
        uses: actions/cache@v4
        with:
          path: dem
          key: fixtures-dem-${{ hashFiles('new/fixtures/parks.json', 'new/fixtures/oracle.json') }}-${{ github.sha }}
          restore-keys: fixtures-dem-${{ hashFiles('new/fixtures/parks.json', 'new/fixtures/oracle.json') }}-

      - name: Curate with ${{ github.base_ref }}
        if: github.event_name == 'pull_request' && steps.prevcache.outputs.cache-hit != 'true'
        run: new/fixtures/run.sh base-bin/routes tiles prev/base qrank.db dem "$LIMIT"

      - name: Curate with this change
        run: new/fixtures/run.sh new/target/release/routes tiles out/new qrank.db dem "$LIMIT"

      - name: Compare
        if: github.event_name == 'pull_request'
        run: |
          if [ "${{ steps.prevcache.outputs.cache-hit }}" = true ]; then
            echo "${{ github.base_ref }}'s results (and times) are from its own run, on another runner of the same kind." | tee -a "$GITHUB_STEP_SUMMARY"
          fi
          python3 new/fixtures/compare.py prev/base out/new | tee -a "$GITHUB_STEP_SUMMARY"

      # Routes we've fixed and must keep offering, named right
      # (fixtures/expect.json): a change that loses one fails here.
      - name: Named regressions
        run: python3 new/fixtures/expect.py out/new | tee -a "$GITHUB_STEP_SUMMARY"

      # Known-hike recall on the oracle sample: ~160 parks with OSM hiking
      # routes, in a tuning half and a held-out half (see fixtures/oracle.py).
      # Without the bump for following an OSM hiking route (--no-known-bonus)
      # it measures the route proposer alone; with it, what ships, which the
      # bump partly earns by itself.
      - name: Oracle sample with ${{ github.base_ref }}
        if: github.event_name == 'pull_request' && steps.prevcache.outputs.cache-hit != 'true'
        env:
          ROUTES_ARGS: --no-known-bonus
        run: new/fixtures/run.sh base-bin/routes tiles/oracle prev/oracle-base qrank.db dem 120 new/fixtures/oracle.json > /dev/null

      - name: Oracle sample with this change, no bump for known routes
        env:
          ROUTES_ARGS: --no-known-bonus
        run: new/fixtures/run.sh new/target/release/routes tiles/oracle out/oracle-new qrank.db dem 120 new/fixtures/oracle.json > /dev/null

      - name: Oracle sample with this change, as it ships
        if: github.event_name == 'pull_request'
        run: new/fixtures/run.sh new/target/release/routes tiles/oracle out/oracle-new-bonus qrank.db dem 120 new/fixtures/oracle.json > /dev/null

      - name: Compare on the oracle sample
        if: github.event_name == 'pull_request'
        run: |
          python3 new/fixtures/oracle.py --title "Known hikes on the oracle sample: the route proposer (no bump for known routes)" \
            prev/oracle-base out/oracle-new new/fixtures/oracle.json | tee -a "$GITHUB_STEP_SUMMARY"
          python3 new/fixtures/oracle.py --title "Known hikes on the oracle sample: as it ships (with the bump)" \
            prev/oracle-base out/oracle-new-bonus new/fixtures/oracle.json | tee -a "$GITHUB_STEP_SUMMARY"

      # On main, this run is the base for pull requests on this commit.
      - name: Keep main's results as a base
        if: github.event_name != 'pull_request'
        run: |
          mkdir -p prev
          cp -r out/new prev/base
          cp -r out/oracle-new prev/oracle-base

      # From a pull request, for its next push on the same base.
      - name: Save the base's results
        if: github.event_name != 'pull_request' || steps.prevcache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: |
            prev/
            !prev/**/parks/
          key: ${{ steps.prev.outputs.key }}

      - name: Upload the routes and logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fixtures
          path: |
            out/
            prev/
            !out/**/parks/
            !prev/**/parks/
