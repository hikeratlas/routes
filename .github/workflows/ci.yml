name: CI
on:
  push:
    branches: [main]
  pull_request:
jobs:
  test:
    runs-on: ubuntu-24.04-arm
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      # Saved only from main, where every pull request can restore it.
      - uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - run: cargo build --release --locked
      - run: cargo test --release --locked
      # Each main commit's binary, for hikeratlas/basemap's routes builds
      # (ROUTES_REF): they download it rather than compile it on every curate
      # shard of every run that bumps it. One rolling release, "bin", with an
      # asset per commit, routes-<sha>-aarch64-linux, built on the runner
      # basemap curates on; the newest KEEP are kept.
      - name: Publish the binary
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
          KEEP: 30
        run: |
          gh release view bin >/dev/null 2>&1 || gh release create bin --title "Binaries" --latest=false \
            --notes "Each main commit's routes binary (Linux, aarch64), for hikeratlas/basemap's routes builds: routes-<sha>-aarch64-linux. The newest $KEEP are kept."
          asset="routes-$GITHUB_SHA-aarch64-linux"
          cp target/release/routes "$asset"
          gh release upload bin "$asset" --clobber
          gh api "repos/$GITHUB_REPOSITORY/releases/tags/bin" --jq '.assets | sort_by(.created_at) | reverse | .['"$KEEP"':][] | .id' |
            while read -r id; do gh api -X DELETE "repos/$GITHUB_REPOSITORY/releases/assets/$id"; done
